services:
  hlds:
    build:
      context: .
      args:
        - GAME=${GAME}
        - FLAG=${FLAG}
        - VERSION=${VERSION}
        - IMAGE=${IMAGE}
        - REHLDS_INSTALL=${REHLDS_INSTALL}
    volumes:
      - "./config:/temp/config"
      - "./mods:/temp/mods"
    ports:
      - "27015:27015/udp"
      - "27015:27015"
      - "26900:2690/udp"
    environment:
      - GAME=${GAME}
      - FLAG=${FLAG}
      - VERSION=${VERSION}
      - IMAGE=${IMAGE}
      - REHLDS_INSTALL=${REHLDS_INSTALL}
    command: +maxplayers 12 +log on +rcon_password "changeme" +map crossfire
